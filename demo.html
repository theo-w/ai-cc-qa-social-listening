<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QCC Workbench · 单文件演示（MVP）</title>
<style>
/* ===== 设计 token（与 apps/web/src/styles/tokens.css 对齐） ===== */
:root{
  --paper:#f5f4f0;--paper-deep:#ece9e2;--surface:#fff;--surface-subtle:#faf9f6;
  --ink:#17191d;--ink-soft:#3f434b;--ink-muted:#6f747e;--ink-faint:#9a9ea7;
  --line:#e4e1d8;--line-strong:#cfcbc0;
  --primary:#145c4c;--primary-hover:#0e4a3d;--primary-wash:#e7f0ec;--primary-wash-strong:#d6e7e0;--primary-ink:#0b3a30;
  --ok:#2b7554;--ok-wash:#e5f1ea;--ok-ink:#1c523a;
  --warn:#9c6612;--warn-wash:#f7efdd;--warn-ink:#6e4708;
  --danger:#b0372a;--danger-wash:#f8e8e4;--danger-ink:#7d241b;
  --info:#325d94;--info-wash:#e7eef7;--info-ink:#21406a;
  --neutral-wash:#efeee9;--neutral-ink:#4d5158;
  --sidebar-bg:#14171a;--sidebar-bg-soft:#1a1e22;--sidebar-ink:#e9e9e5;--sidebar-muted:#9298a0;--sidebar-faint:#6b7178;--sidebar-line:#272c31;--sidebar-active:#223029;--sidebar-active-ink:#f0f4f1;--sidebar-accent:#7fb8a5;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-serif:"Songti SC","Noto Serif SC","STSong",Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --r-xs:3px;--r-sm:4px;--r-md:6px;--r-lg:10px;--r-pill:999px;
  --shadow-pop:0 6px 20px rgba(23,25,29,.1);--shadow-drawer:-16px 0 40px rgba(23,25,29,.16);--shadow-modal:0 20px 56px rgba(23,25,29,.22);
  --sidebar-w:232px;--topbar-h:56px;--content-max:1440px;
  --dur-1:120ms;--dur-2:180ms;--ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}
button:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.94em}
.muted{color:var(--ink-muted)}
.faint{color:var(--ink-faint)}
.serif{font-family:var(--font-serif)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid transparent;border-radius:999px;background-clip:content-box}

/* ===== 骨架 ===== */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;z-index:20;height:100vh;display:flex;flex-direction:column;background:var(--sidebar-bg);color:var(--sidebar-ink);border-right:1px solid var(--sidebar-line);overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 16px;border-bottom:1px solid var(--sidebar-line);flex:none}
.brand__logo{width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--sidebar-accent);border-radius:4px;color:var(--sidebar-accent);font-family:var(--font-serif);font-size:13px;font-weight:600}
.brand__text{display:flex;flex-direction:column;min-width:0}
.brand__name{font-size:13px;font-weight:600;white-space:nowrap}
.brand__sub{font-size:11px;line-height:16px;color:var(--sidebar-muted);white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:16px 8px;display:flex;flex-direction:column;gap:4px}
.nav__label{padding:12px 12px 8px;font-size:11px;letter-spacing:.08em;color:var(--sidebar-faint);white-space:nowrap}
.nav__item{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:6px;color:var(--sidebar-muted);white-space:nowrap;background:none;border:0;text-align:left;font-size:14px;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.nav__item:hover{background:var(--sidebar-bg-soft);color:var(--sidebar-ink)}
.nav__item.is-active{background:var(--sidebar-active);color:var(--sidebar-active-ink);box-shadow:inset 2px 0 0 var(--sidebar-accent)}
.nav__item svg{flex:none;width:18px;height:18px;stroke-width:1.6}
.nav__item.is-active svg{color:var(--sidebar-accent)}
.sidebar__foot{flex:none;border-top:1px solid var(--sidebar-line);padding:12px 16px;display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:16px;color:var(--sidebar-faint);white-space:nowrap}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:16px;padding:0 32px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-muted);min-width:0}
.crumbs b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:12px;height:12px;color:var(--ink-faint)}
.spacer{flex:1}
.topbar__actions{display:flex;align-items:center;gap:12px}
.demo-badge{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 8px;border:1px solid var(--warn);border-radius:4px;color:var(--warn-ink);background:var(--warn-wash);font-size:11px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.demo-badge i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.content{flex:1;width:100%;max-width:var(--content-max);margin:0 auto;padding:24px 32px 48px;min-width:0}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.page-head h1{font-size:20px;line-height:28px;font-weight:600;letter-spacing:.01em}
.page-head p{margin-top:4px;font-size:13px;line-height:20px;color:var(--ink-muted);max-width:760px}
.page-head .spacer{flex:1}
.section-title{font-size:16px;line-height:24px;font-weight:600}
.section-sub{font-size:12px;line-height:18px;color:var(--ink-muted)}

/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;white-space:nowrap;transition:background var(--dur-1),border-color var(--dur-1)}
.btn:hover{border-color:var(--ink-faint);background:var(--surface-subtle)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke-width:1.7}
.btn--primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn--primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn--danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn--danger:hover{filter:brightness(.94)}
.btn--ghost{border-color:transparent;background:transparent;color:var(--ink-muted)}
.btn--ghost:hover{background:var(--neutral-wash);color:var(--ink)}
.btn--sm{height:28px;padding:0 10px;font-size:12px}
.segmented{display:inline-flex;padding:2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.segmented button{height:26px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--ink-muted);font-size:12px}
.segmented button.is-active{background:var(--primary-wash);color:var(--primary-ink);font-weight:500}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.card__head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card__head h3{font-size:14px;font-weight:600}
.card__head .section-sub{margin-top:2px}
.card__body{padding:18px}
.card__body--flush{padding:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:11px;line-height:1;white-space:nowrap;letter-spacing:.02em}
.badge--ok{background:var(--ok-wash);color:var(--ok-ink)}
.badge--warn{background:var(--warn-wash);color:var(--warn-ink)}
.badge--danger{background:var(--danger-wash);color:var(--danger-ink)}
.badge--info{background:var(--info-wash);color:var(--info-ink)}
.badge--muted{background:var(--neutral-wash);color:var(--neutral-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 16px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line)}
.kpi.ok::after{background:var(--ok)}.kpi.warn::after{background:var(--warn)}.kpi.bad::after{background:var(--danger)}
.kpi__label{font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.kpi__value{margin-top:8px;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi__value small{font-size:14px;font-weight:500;color:var(--ink-muted);margin-left:2px}
.kpi__meta{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint)}
.kpi__delta{font-variant-numeric:tabular-nums}
.kpi__delta.up{color:var(--ok-ink)}.kpi__delta.down{color:var(--danger-ink)}
.stats-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stat{padding:14px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat__label{font-size:12px;color:var(--ink-muted)}
.stat__value{margin-top:4px;font-size:22px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stat__hint{margin-top:2px;font-size:11px;color:var(--ink-faint)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-subtle);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-click]{cursor:pointer;transition:background var(--dur-1)}
tbody tr[data-click]:hover{background:var(--surface-subtle)}
.cell-title{font-weight:500;color:var(--ink)}
.cell-sub{margin-top:2px;font-size:11px;color:var(--ink-faint)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.input,.select{height:34px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 10px;font-size:13px;min-width:0}
.input{width:240px}
.input::placeholder{color:var(--ink-faint)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{height:38px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-muted);font-size:13px}
.tabs button.is-active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.bar-list{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 42px;align-items:center;gap:10px;font-size:12px}
.bar-track{height:8px;border-radius:999px;background:var(--neutral-wash);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--primary);transition:width .5s var(--ease)}
.bar-fill.info{background:var(--info)}.bar-fill.warn{background:var(--warn)}.bar-fill.danger{background:var(--danger)}.bar-fill.ok{background:var(--ok)}
.bar-value{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.chart{width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font-sans);font-size:10px;fill:var(--ink-faint)}
.chart .grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{stroke:var(--line-strong)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-muted)}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.anomaly{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:6px;background:var(--surface-subtle);cursor:pointer;transition:background var(--dur-1)}
.anomaly:hover{background:var(--danger-wash)}
.anomaly__icon{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--danger-wash);color:var(--danger-ink)}
.anomaly__icon svg{width:15px;height:15px}
.anomaly__title{font-size:13px;font-weight:500}
.anomaly__desc{margin-top:2px;font-size:12px;color:var(--ink-muted)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-faint);font-size:13px}
.hint{font-size:12px;color:var(--ink-faint);line-height:18px}
.timeline{display:grid;gap:0}
.tl-item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:7px;top:14px;bottom:0;width:1px;background:var(--line)}
.tl-dot{width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);z-index:1}
.tl-item:first-child .tl-dot{background:var(--primary)}
.tl-title{font-size:12px;font-weight:500;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl-note{margin-top:2px;font-size:12px;color:var(--ink-muted)}
.tl-time{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tl-by{font-size:11px;color:var(--ink-faint)}
.sev{border-left:3px solid var(--line)}
.sev--danger{border-left-color:var(--danger)}
.sev--warn{border-left-color:var(--warn)}
.sev--info{border-left-color:var(--info)}
.msg{padding:10px 12px;border-radius:6px;background:var(--surface-subtle);border:1px solid var(--line);font-size:13px;line-height:20px}
.msg--agent{background:var(--primary-wash);border-color:var(--primary-wash-strong);margin-left:32px}
.msg--hit{outline:2px solid var(--danger);outline-offset:1px;background:var(--danger-wash)}
.msg__meta{font-size:11px;color:var(--ink-faint);margin-bottom:4px;display:flex;gap:8px}
.tagchip{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-subtle);font-size:12px;line-height:18px}
.tagchip b{font-weight:600}
.tagchip .mono{color:var(--ink-faint)}
.tagchip__evidence{color:var(--ink-muted);font-size:11px;display:block;margin-top:4px;border-left:2px solid var(--line-strong);padding-left:8px}

/* ===== 抽屉 / toast ===== */
.drawer-mask{position:fixed;inset:0;background:rgba(23,25,29,.28);opacity:0;pointer-events:none;transition:opacity var(--dur-2);z-index:60}
.drawer-mask.is-open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:var(--paper);box-shadow:var(--shadow-drawer);transform:translateX(102%);transition:transform var(--dur-3) var(--ease);z-index:61;display:flex;flex-direction:column}
.drawer.is-open{transform:translateX(0)}
.drawer__head{flex:none;display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer__head h2{font-size:16px;line-height:24px;font-weight:600}
.drawer__head p{margin-top:3px;font-size:12px;line-height:18px;color:var(--ink-muted)}
.drawer__body{flex:1;overflow-y:auto;padding:20px 22px}
.drawer__foot{flex:none;display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface)}
.icon-btn{width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;display:grid;place-items:center;color:var(--ink-muted)}
.icon-btn:hover{background:var(--neutral-wash);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
#toast{position:fixed;right:24px;bottom:24px;z-index:100;display:grid;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:8px;background:var(--ink);color:#fff;box-shadow:0 10px 28px rgba(23,25,29,.18);font-size:13px;max-width:360px;animation:toast-in .18s var(--ease)}
.toast b{display:block;font-weight:600;margin-bottom:2px}
.toast span{color:#c9ccd2;font-size:12px}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:1279px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .brand{padding:0;justify-content:center}
  .brand__text,.nav__label,.nav__item span,.sidebar__foot{display:none}
  .nav{padding:16px 8px}.nav__item{justify-content:center;padding:0}
  .topbar{padding:0 20px}.content{padding-left:20px;padding-right:20px}
}
@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand__logo">QC</span>
      <span class="brand__text"><span class="brand__name">QCC Workbench</span><span class="brand__sub">客服运营质量管控</span></span>
    </div>
    <nav class="nav" id="nav" aria-label="主导航">
      <div class="nav__label">运营</div>
      <button class="nav__item" data-route="dashboard" data-end="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>运营总览</span></button>
      <button class="nav__item" data-route="qc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5h6M9 3h6a2 2 0 0 1 2 2v16l-5-3-5 3V5a2 2 0 0 1 2-2Z"/><path d="m9 12 2 2 4-4"/></svg><span>质检</span></button>
      <button class="nav__item" data-route="knowledge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3Z"/></svg><span>知识库</span></button>
      <button class="nav__item" data-route="badcases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg><span>badcase</span></button>
      <button class="nav__item" data-route="sentiment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/><path d="M8 9h8M8 13h5"/></svg><span>舆情</span></button>
      <button class="nav__item" data-route="clues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg><span>线索</span></button>

function parseHash() {
  const raw = (location.hash || "#/dashboard").replace(/^#\/?/, "");
  const [name, query] = raw.split("?");
  state.route = ROUTES[name] ? name : "dashboard";
  if (query) {
    const params = new URLSearchParams(query);
    if (params.get("tab") === "alerts") state.sentimentTab = "alerts";
    if (params.get("status")) state.badcaseStatus = params.get("status");
  }
}
function go(route, query = "") {
  location.hash = `#/${route}${query}`;
}
function render() {
  const route = ROUTES[state.route];
  document.title = `QCC Workbench · ${route.title}`;
  $("#crumbs").innerHTML = route.crumb.map((item, i) => `${i ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg>' : ""}${i === route.crumb.length - 1 ? `<b>${esc(item)}</b>` : `<span>${esc(item)}</span>`}`).join("");
  $("#view").innerHTML = route.render();
  document.querySelectorAll(".nav__item").forEach((btn) => btn.classList.toggle("is-active", btn.dataset.route === state.route));
  document.querySelectorAll("#range-switch button").forEach((btn) => btn.classList.toggle("is-active", btn.dataset.range === state.range));
}

/* ===== 总览 ===== */
function renderDashboard() {
  const summary = DATA.summary[state.range];
  const trends = DATA.trends[state.range].rows;
  const s = summary;
  const fmt = (v, unit) => unit === "percent" ? pct(v, v < 0.1 ? 1 : 0) : (unit === "minutes" || unit === "min") ? `${v} 分` : unit === "score" ? Number(v).toFixed(1) : num(v);
  const fmtDelta = (delta, unit) => {
    if (!delta) return "持平";
    const arrow = delta > 0 ? "↑" : "↓";
    if (unit === "percent") return `${arrow} ${(Math.abs(delta) * 100).toFixed(1)}pp`;
    if (unit === "minutes" || unit === "min") return `${arrow} ${Math.abs(delta)} 分`;
    return `${arrow} ${Math.abs(delta).toFixed(unit === "score" ? 1 : 2)}`;
  };
  const kpis = s.kpis.map((k) => {
    const tone = k.status === "ok" ? "ok" : k.status === "warn" ? "warn" : "bad";
    const value = fmt(k.value, k.unit);
    return `<div class="kpi ${tone}">
      <div class="kpi__label">${esc(k.label)}${badge(k.status === "ok" ? "达标" : "待改善", tone)}</div>
      <div class="kpi__value">${esc(value)}</div>
      <div class="kpi__meta"><span>目标 ${esc(k.op)} ${esc(fmt(k.target, k.unit))}</span><span class="kpi__delta ${k.delta >= 0 ? "up" : "down"}">${esc(fmtDelta(k.delta, k.unit))}</span></div>
    </div>`;
  }).join("");

  const series = [
    { key: "qcAccuracy", label: "质检准确率", color: "var(--primary)" },
    { key: "alertPrecision", label: "预警准确率", color: "var(--info)" },
    { key: "badcaseCloseRate", label: "badcase 关闭率", color: "var(--warn)" },
  ];
  const labels = trends.map((r) => dateOnly(r.date));
  const chart = lineChart(trends, labels, series);

  const tagBars = barList(s.distribution.tags.map((t) => ({ label: t.name, value: t.count })), "primary");
  const channelBars = barList(s.distribution.channels.map((c) => ({ label: LABELS.channel[c.channel] ?? c.channel, value: c.count })), "info");
  const levelBars = barList(s.distribution.alertLevels.map((l) => ({ label: l.level, value: l.count, tone: l.level === "P0" ? "danger" : l.level === "P1" ? "warn" : "info" })), "warn");
  const anomalyCards = DATA.anomalies.map((a) => `
    <div class="anomaly" data-action="drill" data-drill="${esc(a.drillType)}" data-filter="${esc(JSON.stringify(a.drillFilter))}">
      <span class="anomaly__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></span>
      <div><div class="anomaly__title">${esc(a.metricLabel)} · ${badge(a.severity === "bad" ? "异常" : "关注", a.severity === "bad" ? "danger" : "warn")}</div>
      <div class="anomaly__desc">当前 ${pct(a.current)}，目标 ${pct(a.target)}，偏差 ${(a.deviation * 100).toFixed(1)}pp · 责任人 ${esc(a.owner)}</div>
      <div class="hint" style="margin-top:4px">${esc(a.suggestion)}</div></div>
    </div>`).join("");

  return `
    ${pageHead("运营总览", "用 AI 把质量管控和舆情响应，从「抽检 + 人工盯」变成「全量检测 + 分级响应 + 闭环复盘 + 线索传递」。", "")}
    <div class="kpi-grid">${kpis}</div>
    <div class="grid-2" style="margin-top:16px">
      <section class="card"><div class="card__head"><div><h3>核心指标趋势</h3><div class="section-sub">近 ${state.range.replace("d", "")} 天 · 数据截至演示时刻</div></div><span class="spacer"></span></div>
        <div class="card__body">${chart}<div class="legend" style="margin-top:10px">${series.map((x) => `<span><i style="background:${x.color}"></i>${x.label}</span>`).join("")}</div></div></section>
      <section class="card"><div class="card__head"><div><h3>异常与待办</h3><div class="section-sub">点击异常卡下钻到对应列表</div></div></div>
        <div class="card__body stack">
          <div class="stats-strip" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            <div class="stat"><div class="stat__label">待复核</div><div class="stat__value">${s.volume.reviewPending}</div><div class="stat__hint">低置信度会话</div></div>
            <div class="stat"><div class="stat__label">未关闭 badcase</div><div class="stat__value">${s.volume.badcasesOpen}</div><div class="stat__hint">含超期 ${DATA.badcaseStats.overdue} 条</div></div>
            <div class="stat"><div class="stat__label">未处置预警</div><div class="stat__value">${s.volume.alertsOpen}</div><div class="stat__hint">P0 / P1 优先</div></div>
            <div class="stat"><div class="stat__label">推进中线索</div><div class="stat__value">${s.volume.cluesOpen}</div><div class="stat__hint">产品 / 品牌 / 市场</div></div>
          </div>
          ${anomalyCards}
        </div></section>
    </div>
    <div class="grid-3" style="margin-top:16px">
      <section class="card"><div class="card__head"><h3>质检标签分布</h3></div><div class="card__body">${tagBars}</div></section>
      <section class="card"><div class="card__head"><h3>渠道分布</h3></div><div class="card__body">${channelBars}</div></section>
      <section class="card"><div class="card__head"><h3>预警级别</h3></div><div class="card__body">${levelBars}</div></section>
    </div>`;
}

/* ===== 质检 ===== */
function renderQc() {
  const list = DATA.conversations.filter((item) => {
    const c = item.conversation, q = item.qcResult;
    if (state.qc.verdict && q.verdict !== state.qc.verdict) return false;
    if (state.qc.tag && !q.tags.some((t) => t.code === state.qc.tag)) return false;
    if (state.qc.q) {
      const hay = `${c.id} ${c.agent.name} ${c.customer.name} ${c.product} ${q.summary}`.toLowerCase();
      if (!hay.includes(state.qc.q.toLowerCase())) return false;
    }
    return true;
  });
  const st = DATA.qcStats;
  const rows = list.map((item) => {
    const c = item.conversation, q = item.qcResult;
    const review = state.reviews[c.id];
    const verdict = review?.decision === "overturn" ? "pass" : q.verdict;
    const needs = review ? false : q.needsReview;
    return `<tr data-click data-action="open-conv" data-id="${esc(c.id)}">
      <td><div class="cell-title mono">${esc(c.id)}</div><div class="cell-sub">${esc(c.product)} · ${esc(LABELS.channel[c.channel] ?? c.channel)}</div></td>
      <td><div>${esc(c.agent.name)}</div><div class="cell-sub">${esc(c.customer.name)}</div></td>
      <td>${badge(LABELS.verdict[verdict] ?? verdict, verdict)}</td>
      <td>${q.tags.length ? q.tags.map((t) => badge(t.name, "muted")).join(" ") : '<span class="faint">—</span>'}</td>
      <td class="num">${q.score}</td>
      <td>${review ? badge(review.decision === "overturn" ? "已改判" : "已复核", "ok") : needs ? badge("待复核", "warn") : '<span class="faint">—</span>'}</td>
    </tr>`;
  }).join("");

  return `
    ${pageHead("质检", "全量检测 → 评分/标签/证据 → 低置信度人工复核 → badcase 归因分派。当前演示内置 18 条代表性会话。", "")}
    <div class="stats-strip">
      ${statItem("已分析", num(st.analyzed), `覆盖率 ${pct(st.analyzed / st.total)}`)}
      ${statItem("违规会话", num(st.violation), `通过 ${st.pass} 条`)}
      ${statItem("待复核", num(st.needsReview), "置信度 < 0.75")}
      ${statItem("平均分", st.avgScore.toFixed(1), `复核占比 ${pct(st.reviewRatio)}`)}
    </div>
    <section class="card" style="margin-top:16px">
      <div class="card__head"><div><h3>会话列表</h3><div class="section-sub">点击行查看消息与证据回看</div></div></div>
      <div class="card__body card__body--flush">
        <div class="toolbar" style="padding:14px 16px 0">
          <input class="input" id="qc-q" placeholder="搜索会话 / 坐席 / 客户" value="${esc(state.qc.q)}" />
          <select class="select" id="qc-verdict">
            <option value="">全部判定</option>
            <option value="violation" ${state.qc.verdict === "violation" ? "selected" : ""}>违规</option>
            <option value="pass" ${state.qc.verdict === "pass" ? "selected" : ""}>通过</option>
          </select>
          <select class="select" id="qc-tag">
            <option value="">全部标签</option>
            ${st.tagDistribution.map((t) => `<option value="${esc(t.code)}" ${state.qc.tag === t.code ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
          </select>
          <span class="spacer"></span><span class="hint">${list.length} 条</span>
        </div>
        <div class="table-wrap"><table><thead><tr><th>会话</th><th>坐席 / 客户</th><th>判定</th><th>标签</th><th>评分</th><th>复核</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">没有匹配的会话</td></tr>'}</tbody></table></div>
      </div>
    </section>`;
}

/* ===== badcase ===== */
function renderBadcases() {
  const list = state.badcases.filter((b) => !state.badcaseStatus || b.status === state.badcaseStatus);
  const rows = list.map((b) => `
    <tr data-click data-action="open-badcase" data-id="${esc(b.id)}">
      <td><div class="cell-title mono">${esc(b.code)}</div><div class="cell-sub">${esc(b.id)}</div></td>
      <td><div>${esc(b.title)}</div><div class="cell-sub">${esc(LABELS.category[b.category] ?? b.category)} · ${b.recurrence ? '<span style="color:var(--danger)">复发</span>' : "首次"}</div></td>
      <td>${badge(LABELS.badcaseStatus[b.status] ?? b.status, b.status)}</td>
      <td>${badge(LABELS.severity[b.severity] ?? b.severity, b.severity === "high" ? "danger" : b.severity === "medium" ? "warn" : "muted")}</td>
      <td>${esc(b.owner)}</td>
      <td class="num">${dateTime(b.dueAt)}${isOverdue(b) ? " " + badge("超期", "danger") : ""}</td>
    </tr>`).join("");
  const counts = state.badcases.reduce((acc, b) => ((acc[b.status] = (acc[b.status] || 0) + 1), acc), {});
  const overdue = state.badcases.filter((b) => b.status !== "closed" && Date.parse(b.dueAt) < Date.parse(DATA.meta.generatedAt)).length;
  return `
    ${pageHead("badcase 闭环", "违规对话一键转 badcase，按根因路由责任人并设置 SLA；关闭必须填写整改证明，同坐席同标签 14 天内复发明示。", "")}
    <div class="stats-strip">
      ${statItem("总数", num(state.badcases.length), "演示样本")}
      ${statItem("待处理 / 处理中", `${counts.open || 0} / ${counts.in_progress || 0}`, "SLA 倒计时中")}
      ${statItem("待验证", num(counts.pending_verify || 0), "需提交整改证明")}
      ${statItem("已超期", num(overdue), "按演示时刻计算")}
    </div>
    <section class="card" style="margin-top:16px">
      <div class="card__head"><div><h3>列表</h3><div class="section-sub">点击行查看根因、证据与处理时间线</div></div><span class="spacer"></span>
        <select class="select" id="badcase-status">
          <option value="">全部状态</option>
          ${["open", "in_progress", "pending_verify", "closed"].map((s) => `<option value="${s}" ${state.badcaseStatus === s ? "selected" : ""}>${LABELS.badcaseStatus[s]}</option>`).join("")}
        </select>
      </div>
      <div class="card__body card__body--flush"><div class="table-wrap"><table>
        <thead><tr><th>编号</th><th>问题</th><th>状态</th><th>严重度</th><th>责任人</th><th>SLA 截止</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">没有匹配的 badcase</td></tr>'}</tbody></table></div></div>
    </section>`;
}

/* ===== 知识库 ===== */
function renderKnowledge() {
  const K = DATA.knowledge;
  const stats = K.stats;
  const list = K.entries.filter(
    (e) =>
      (!state.kbFilter.status || e.status === state.kbFilter.status) &&
      (!state.kbFilter.category || e.category === state.kbFilter.category),
  );
  const rows = list
    .map(
      (e) => `
    <tr data-click data-action="open-knowledge" data-id="${esc(e.id)}">
      <td><div class="cell-title mono">${esc(e.code)}</div></td>
      <td><div class="cell-title">${esc(e.title)}</div><div class="cell-sub">${esc(LABELS.knowledgeCategory[e.category] ?? e.category)}</div></td>
      <td class="num">v${e.version}</td>
      <td>${badge(LABELS.knowledgeStatus[e.status] ?? e.status, knowledgeStatusTone(e.status))}</td>
      <td>${badge(LABELS.knowledgeSource[e.source] ?? e.source, e.source === "official" ? "info" : "warn")}</td>
      <td class="num">${e.hits.length}</td>
      <td class="num">${e.linkedBadcases.length}</td>
      <td class="num">${dateTime(e.updatedAt)}</td>
    </tr>`,
    )
    .join("");

  const gapList = K.gaps
    .map((g) => {
      // 缺口样本优先跳会话；会话未内嵌时（如历史 badcase）退回 badcase 抽屉
      const hasConv = DATA.conversations.some((x) => x.conversation.id === g.sample.conversationId);
      const linkButton = hasConv
        ? `<button class="btn btn--sm" data-action="open-conv" data-id="${esc(g.sample.conversationId)}">查看会话</button>`
        : g.badcaseId
          ? `<button class="btn btn--sm" data-action="open-badcase" data-id="${esc(g.badcaseId)}">查看 badcase</button>`
          : "";
      return `
    <div style="border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        ${badge(g.type === "unlinked_qc_hit" ? `规则 ${g.ruleId ?? "—"}` : "badcase", g.type === "unlinked_qc_hit" ? "danger" : "warn")}
        <b>${esc(g.title)}</b>
        <span class="hint">出现 ${num(g.count)} 次 · 建议分类「${esc(LABELS.knowledgeCategory[g.category] ?? g.category)}」</span>
        <span class="spacer"></span>
        ${linkButton}
      </div>
      <div class="hint" style="margin-top:4px">${esc(g.sample.conversationId)}${g.sample.quote ? ` · 「${esc(g.sample.quote)}」` : ""}</div>
    </div>`;
    })
    .join("");

  return `
    ${pageHead("知识库", "结构化标准口径 + 事实校验规则 + 版本历史：质检知识错误反向驱动条目修订与缺口补齐，草稿条目不参与判定。", "")}
    <div class="stats-strip">
      ${statItem("已发布", `${num(stats.published)} / ${num(stats.total)}`, "条已发布条目")}
      ${statItem("草稿", num(stats.draft), "待补齐事实与规则")}
      ${statItem("知识错误关联率", pct(stats.hits.linkRate, 0), `${stats.hits.linked} / ${stats.hits.knowledgeTags} 条命中已关联`)}
      ${statItem("待完善缺口", num(stats.gaps), stats.gaps > 0 ? "需知识运营处理" : "全部已覆盖")}
    </div>
    ${
      stats.gaps > 0
        ? `<section class="card" style="margin-top:16px"><div class="card__head"><div><h3>知识缺口</h3><div class="section-sub">质检命中或知识类 badcase 未关联到条目，需要补充标准口径</div></div></div>
      <div class="card__body stack">${gapList}</div></section>`
        : ""
    }
    <section class="card" style="margin-top:16px">
      <div class="card__head"><div><h3>条目列表</h3><div class="section-sub">点击行查看标准口径、事实规则与版本历史</div></div><span class="spacer"></span>
        <select class="select" id="knowledge-status">
          <option value="">全部状态</option>
          ${["published", "draft", "offline"].map((s) => `<option value="${s}" ${state.kbFilter.status === s ? "selected" : ""}>${LABELS.knowledgeStatus[s]}</option>`).join("")}
        </select>
        <select class="select" id="knowledge-category" style="margin-left:8px">
          <option value="">全部分类</option>
          ${Object.entries(LABELS.knowledgeCategory).map(([k, v]) => `<option value="${k}" ${state.kbFilter.category === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
      </div>
      <div class="card__body card__body--flush"><div class="table-wrap"><table>
        <thead><tr><th>编号</th><th>条目</th><th>版本</th><th>状态</th><th>来源</th><th>命中</th><th>关联 badcase</th><th>更新时间</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="empty">没有匹配的知识条目</td></tr>'}</tbody></table></div></div>
    </section>`;
}

/* ===== 舆情 ===== */

  const counts = DATA.comments.reduce((acc, c) => ((acc[c.sentiment] = (acc[c.sentiment] || 0) + 1), acc), {});
  const commentRows = comments.slice(0, 18).map((c) => `
    <tr>
      <td><div class="cell-title">${esc(c.author)}</div><div class="cell-sub">${esc(LABELS.source[c.source] ?? c.source)} · ${esc(c.brand)}</div></td>

      <td>${badge(LABELS.sentiment[c.sentiment], c.sentiment)}</td>
      <td>${c.alertId ? badge("已入库", "info") : '<span class="faint">—</span>'}</td>
    </tr>`).join("");
  const alertRows = state.alerts.map((wrap) => {
    const a = wrap.alert;
    return `<div class="anomaly" style="border-left-color:${a.level === "P0" ? "var(--danger)" : a.level === "P1" ? "var(--warn)" : "var(--info)"}" data-action="open-alert" data-id="${esc(a.id)}">
      <span class="anomaly__icon" style="background:${a.level === "P0" ? "var(--danger-wash)" : a.level === "P1" ? "var(--warn-wash)" : "var(--info-wash)"};color:${a.level === "P0" ? "var(--danger-ink)" : a.level === "P1" ? "var(--warn-ink)" : "var(--info-ink)"}">${esc(a.level)}</span>
      <div style="min-width:0;flex:1"><div class="anomaly__title">${esc(a.title)} ${badge(LABELS.alertStatus[a.status] ?? a.status, a.status)}</div>
      <div class="anomaly__desc">${esc(a.summary)}</div>
      <div class="hint" style="margin-top:4px">主题 ${esc(a.topic)} · 关联 ${a.commentIds.length} 条评论 · 责任人 ${esc(a.owner)} · SLA ${a.slaMinutes} 分钟</div></div>

  }).join("");
  const tab = state.sentimentTab;
  return `
    ${pageHead("舆情预警", "公开评论/工单导入 → 情感与主题 → 单条分级 + 聚簇升级（P0/P1/P2）→ 预警 SOP 处置 → 转线索。", "")}
    <div class="stats-strip">
      ${statItem("评论样本", num(DATA.comments.length), "覆盖五类来源")}

      ${statItem("P0 预警", num(state.alerts.filter((x) => x.alert.level === "P0").length), "30 分钟 SLA")}
      ${statItem("未处置预警", num(state.alerts.filter((x) => x.alert.status !== "resolved").length), "演示样本")}
    </div>
    <div class="tabs" style="margin-top:16px">
      <button class="${tab === "comments" ? "is-active" : ""}" data-action="sentiment-tab" data-tab="comments">评论</button>
      <button class="${tab === "alerts" ? "is-active" : ""}" data-action="sentiment-tab" data-tab="alerts">预警</button>
    </div>
    ${tab === "comments" ? `<section class="card"><div class="card__head"><div><h3>评论流</h3><div class="section-sub">按情感筛选，展示主题与置信度</div></div><span class="spacer"></span>
      <select class="select" id="comment-sentiment"><option value="">全部情感</option>${["negative","neutral","positive"].map((s) => `<option value="${s}" ${state.commentSentiment === s ? "selected" : ""}>${LABELS.sentiment[s]}</option>`).join("")}</select></div>
      <div class="card__body card__body--flush"><div class="table-wrap"><table><thead><tr><th>来源</th><th>内容</th><th>情感</th><th>预警</th></tr></thead>
      <tbody>${commentRows || '<tr><td colspan="4" class="empty">没有匹配的评论</td></tr>'}</tbody></table></div></div></section>`
    : `<div class="stack">${alertRows}</div>`}`;
}

/* ===== 评测 ===== */
function renderEval() {
  const cards = DATA.datasets.map((d) => `
    <div class="card"><div class="card__head"><div><h3>${d.dataset === "qc" ? "质检评测集" : "舆情评测集"}</h3><div class="section-sub">${esc(d.datasetId)} · v${esc(d.version)} · ${d.itemCount} 条</div></div>
      <span class="spacer"></span><button class="btn btn--primary btn--sm" data-action="run-eval" data-dataset="${d.dataset}" ${state.evalRunning ? "disabled" : ""}>${state.evalRunning ? "运行中…" : "运行评测"}</button></div>
      <div class="card__body"><p class="hint">${esc(d.description)}</p></div></div>`).join("");

  const metricLabel = {
    accuracy: "准确率", coverage: "覆盖率", verdictAccuracy: "判定一致率", falsePositiveRate: "误报率", falseNegativeRate: "漏报率",
    reviewRatio: "复核占比", avgLatencyMs: "平均耗时", tagPrecisionMacro: "标签 precision(macro)",
    sentimentAccuracy: "情感准确率", topicAccuracy: "主题准确率", alertPrecision: "预警 precision", alertRecall: "预警 recall",
    p0Recall: "P0 recall",
  };
  const runs = state.evalRuns.slice(0, 2).map((run) => {
    const metricRows = Object.entries(run.metrics ?? {}).filter(([, v]) => typeof v === "number").map(([k, v]) => {
      const met = run.thresholdsMet?.[k];
      const shown = k === "avgLatencyMs" ? `${Number(v).toFixed(2)} ms` : (Number(v) <= 1 ? pct(v, 1) : num(v));
      return `<tr><td>${esc(metricLabel[k] ?? k)}</td><td class="num">${esc(shown)}</td><td>${met === undefined ? '<span class="faint">展示</span>' : met ? badge("通过", "ok") : badge("未通过", "danger")}</td></tr>`;
    }).join("");
    const mismatches = (run.mismatches ?? []).slice(0, 5).map((m) => `<li class="hint" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="mono">${esc(m.itemId)}</span> · ${esc(m.reason)}</li>`).join("");
    const gateOk = run.thresholdsMet && Object.values(run.thresholdsMet).every(Boolean);
    return `<section class="card" style="margin-top:16px"><div class="card__head"><div><h3>${run.dataset === "sentiment" ? "舆情评测" : "质检评测"} · ${esc(run.id)}</h3><div class="section-sub">${dateTime(run.runAt)} · ${esc(run.modelVersion)} · 数据集 v${esc(run.datasetVersion)}</div></div>
      <span class="spacer"></span>${gateOk ? badge("门禁通过", "ok") : badge("门禁未通过", "danger")}</div>
      <div class="card__body"><div class="grid-2"><div class="table-wrap"><table><thead><tr><th>指标</th><th>值</th><th>门禁</th></tr></thead><tbody>${metricRows}</tbody></table></div>
      <div><div class="section-title" style="font-size:13px;margin-bottom:8px">错例（最多 5 条）</div><ul>${mismatches || '<li class="hint">无错例</li>'}</ul>
      <div class="hint" style="margin-top:12px">${esc(run.summary ?? "")}</div></div></div></div></section>`;
  }).join("");
  return `
    ${pageHead("评测中心", "用带人工金标的评测集回放质检与舆情引擎，直接给出准确率、误报/漏报、预警准确率与发布门禁结论。", "")}
    <div class="grid-2">${cards}</div>
    ${runs || '<p class="hint">暂无评测记录，点击上方「运行评测」。</p>'}`;
}

/* ===== 抽屉 ===== */
function openConv(id) {
  const item = DATA.conversations.find((x) => x.conversation.id === id);
  if (!item) return;
  const { conversation: c, qcResult: q } = item;
  const review = state.reviews[id];
  const effectiveTags = review?.decision === "overturn" ? [] : (review?.finalTags?.length ? review.finalTags : q.tags.map((t) => t.code));
  const tagCards = q.tags.map((t) => {
    const active = effectiveTags.includes(t.code);
    return `<div class="tagchip" style="${active ? "" : "opacity:.45"}"><div><b>${esc(t.name)}</b> ${badge(`置信 ${pct(t.confidence)}`, t.confidence < 0.75 ? "warn" : "ok")}<span class="mono">${esc(t.ruleId)}</span>
      ${active && t.evidence?.length ? t.evidence.map((e) => `<span class="tagchip__evidence">seq ${e.seq}：「${esc(e.quote)}」${e.note ? ` · ${esc(e.note)}` : ""}</span>`).join("") : ""}</div></div>`;
  }).join("");
  const hits = new Set(q.tags.flatMap((t) => (t.evidence ?? []).map((e) => e.seq)));
  const messages = c.messages.map((m) => `<div class="msg ${m.role === "agent" ? "msg--agent" : ""} ${hits.has(m.seq) ? "msg--hit" : ""}">
    <div class="msg__meta"><span>${m.role === "agent" ? "坐席" : "客户"} · seq ${m.seq}</span><span>+${m.atSec}s</span>${m.gapSec ? `<span>间隔 ${m.gapSec}s</span>` : ""}</div>
    <div>${esc(m.text)}</div></div>`).join("");
  const reviewActions = review ? `<div class="row">${badge("已复核", "ok")} <span class="hint">${esc(review.decision === "confirm" ? "确认 AI 判定" : review.decision === "overturn" ? "推翻 AI 判定" : "修正标签")}</span></div>`
    : `<div class="stack"><div class="hint">复核动作会更新演示内的判定与标签（不写服务端）。</div>
       <div class="row"><button class="btn btn--primary btn--sm" data-action="review" data-id="${esc(id)}" data-decision="confirm">确认 AI 判定</button>
       <button class="btn btn--sm" data-action="review" data-id="${esc(id)}" data-decision="overturn">推翻（改判通过）</button>
       <button class="btn btn--sm" data-action="review" data-id="${esc(id)}" data-decision="amend" data-tags="wrong_knowledge">修正为「知识错误」</button></div></div>`;
  const drawer = `
    <div class="drawer__head"><div style="flex:1"><h2>${esc(c.id)} · ${esc(c.product)}</h2><p>${esc(c.agent.name)} 服务 ${esc(c.customer.name)} · ${esc(LABELS.channel[c.channel] ?? c.channel)} · ${dateTime(c.startedAt)}</p></div>
      <button class="icon-btn" data-action="close-drawer" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="drawer__body">
      <div class="row" style="gap:8px;margin-bottom:12px">${badge(LABELS.verdict[review?.decision === "overturn" ? "pass" : q.verdict], review?.decision === "overturn" ? "pass" : q.verdict)}${badge(`评分 ${q.score}`, "muted")}${q.needsReview ? badge("低置信度待复核", "warn") : ""}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">AI 结论</div>
      <p class="hint" style="margin-bottom:14px">${esc(q.summary)}</p>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">命中标签与证据</div>
      <div class="stack" style="margin-bottom:16px">${tagCards || '<p class="hint">未命中标签。</p>'}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">会话回放</div>
      <div class="stack" style="margin-bottom:16px">${messages}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">人工复核</div>
      ${reviewActions}
    </div>`;
  showDrawer(drawer);
}

function openBadcase(id) {
  const b = state.badcases.find((x) => x.id === id);
  if (!b) return;
  // 详情接口不含 overdue，按演示时刻与 SLA 截止时间在前端计算。
  const overdue = isOverdue(b);
  const next = { open: ["in_progress", "开始处理"], in_progress: ["pending_verify", "提交验证"], pending_verify: ["closed", "确认关闭（需整改证明）"] }[b.status];
  const proofInput = b.status === "pending_verify" ? `<textarea id="badcase-proof" class="input" style="width:100%;height:70px;padding:8px 10px" placeholder="填写整改证明（关闭必填）"></textarea>` : "";
  const actions = next ? `${proofInput}<div class="row" style="margin-top:8px"><button class="btn btn--primary btn--sm" data-action="badcase-next" data-id="${esc(b.id)}">${next[1]}</button>${badge(overdue ? "已超期" : "SLA 内", overdue ? "danger" : "ok")}</div>` : `<div class="row">${badge("已关闭", "ok")}<span class="hint">整改证明：${esc(b.proof ?? "—")}</span></div>`;
  const timeline = (b.timeline ?? []).map((t) => `<div class="tl-item"><span class="tl-dot"></span><div><div class="tl-title">${esc(t.type)} ${t.from ? `<span class="faint">${esc(t.from)} → ${esc(t.to)}</span>` : ""}<span class="tl-by">${esc(t.by)}</span></div><div class="tl-note">${esc(t.note)}</div><div class="tl-time num">${dateTime(t.at)}</div></div></div>`).join("");
  showDrawer(`
    <div class="drawer__head"><div style="flex:1"><h2>${esc(b.code)} · ${esc(b.title)}</h2><p>来源 ${esc(b.conversationId)} · ${esc(LABELS.category[b.category] ?? b.category)} · 责任人 ${esc(b.owner)} · SLA ${b.slaHours}h</p></div>
      <button class="icon-btn" data-action="close-drawer" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="drawer__body">
      <div class="row" style="margin-bottom:12px">${badge(LABELS.badcaseStatus[b.status], b.status)}${badge(LABELS.severity[b.severity], b.severity === "high" ? "danger" : "warn")}${b.recurrence ? badge("复发", "danger") : ""}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">根因</div><p class="hint" style="margin-bottom:14px">${esc(b.rootCause || "—")}</p>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">证据</div>
      <div class="stack" style="margin-bottom:14px">${(b.evidence ?? []).map((e) => `<div class="msg">seq ${e.seq}：「${esc(e.quote)}」</div>`).join("") || '<p class="hint">无</p>'}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">处理动作</div><div style="margin-bottom:16px">${actions}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">时间线</div><div class="timeline">${timeline}</div>
    </div>`);
}

function openKnowledge(id) {
  const e = DATA.knowledge.entries.find((x) => x.id === id);
  if (!e) return;
  const facts = e.facts
    .map(
      (f) => `
    <div class="msg" style="display:block">
      <div class="row" style="gap:8px;flex-wrap:wrap">${badge(f.label, "info")}<span class="hint">${esc(LABELS.knowledgeCompare[f.compare] ?? f.compare)} · ${f.claimCount + f.violationCount} 条识别规则</span></div>
      <div style="margin-top:4px">标准口径：<b>${esc(f.expected)}</b></div>
      ${f.note ? `<div class="hint" style="margin-top:2px">${esc(f.note)}</div>` : ""}
    </div>`,
    )
    .join("");
  const hits = e.hits
    .map(
      (h) => `
    <div class="msg">
      <div class="row" style="gap:8px;flex-wrap:wrap"><b class="mono">${esc(h.conversationId)}</b><span class="hint">${esc(h.agentName)} · 第 ${h.seq} 条消息</span><span class="spacer"></span><button class="btn btn--sm" data-action="open-conv" data-id="${esc(h.conversationId)}">查看会话</button></div>
      <div style="margin-top:4px">「${esc(h.quote)}」</div>
      <div class="hint" style="margin-top:2px">${esc(h.factLabel)}：标准「${esc(h.expected)}」，坐席「${esc(h.actual)}」</div>
    </div>`,
    )
    .join("");
  const badcases = e.linkedBadcases
    .map(
      (b) => `<div class="row">${badge(b.code, "danger")}<span>${esc(b.title)}</span><span class="spacer"></span><button class="btn btn--sm" data-action="open-badcase" data-id="${esc(b.id)}">查看</button></div>`,
    )
    .join("");
  const revisions = [...e.revisions]
    .reverse()
    .map(
      (r) => `
    <div class="tl-item"><span class="tl-dot"></span><div>
      <div class="tl-title">v${r.version} ${badge(LABELS.knowledgeStatus[r.status] ?? r.status, knowledgeStatusTone(r.status))}<span class="tl-by">${esc(r.by)}</span></div>
      <div class="tl-note">${esc(r.note || "—")} · 事实 ${r.factCount} 条</div>
      <div class="tl-time num">${dateTime(r.at)}</div>
      <details style="margin-top:6px"><summary class="hint" style="cursor:pointer">查看该版本口径</summary><p style="white-space:pre-wrap;margin:6px 0 0">${esc(r.content)}</p></details>
    </div></div>`,
    )
    .join("");

  showDrawer(`
    <div class="drawer__head"><div style="flex:1"><h2>${esc(e.title)}</h2><p>${esc(e.code)} · ${esc(LABELS.knowledgeCategory[e.category] ?? e.category)} · 负责人 ${esc(e.owner)}</p></div>
      <button class="icon-btn" data-action="close-drawer" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="drawer__body">
      <div class="row" style="margin-bottom:12px">${badge(LABELS.knowledgeStatus[e.status] ?? e.status, knowledgeStatusTone(e.status))}${badge(LABELS.knowledgeSource[e.source] ?? e.source, "info")}${e.keywords.map((k) => badge(k, "muted")).join("")}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">标准口径（v${e.version}）</div>
      <p style="margin:0 0 14px">${esc(e.content)}</p>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">事实校验规则（${e.facts.length}）</div>
      <div class="stack" style="margin-bottom:14px">${facts || '<p class="hint">草稿尚未补充事实规则，不参与质检判定。</p>'}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">知识错误证据（${e.hits.length}）</div>
      <div class="stack" style="margin-bottom:14px">${hits || '<p class="hint">暂无关联命中</p>'}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">关联 badcase（${e.linkedBadcases.length}）</div>
      <div class="stack" style="margin-bottom:14px">${badcases || '<p class="hint">暂无关联 badcase</p>'}</div>
      <div class="section-title" style="font-size:13px;margin:16px 0 8px">版本历史</div>
      <div class="timeline">${revisions}</div>
    </div>`);
}

  const a = wrap.alert;
  const comments = (wrap.comments ?? []).slice(0, 6);
  const next = { new: ["acknowledged", "确认预警"], acknowledged: ["responding", "开始响应"], responding: ["escalated", "升级处置"], escalated: ["resolved", "标记已解决"] }[a.status];
  const action = next ? `<div class="row" style="margin-bottom:16px"><button class="btn btn--primary btn--sm" data-action="alert-next" data-id="${esc(a.id)}">${next[1]}</button>${badge(`SLA ${a.slaMinutes} 分钟`, a.slaMinutes <= 30 ? "danger" : "warn")}</div>` : `<div class="row" style="margin-bottom:16px">${badge("已解决", "ok")}</div>`;
  showDrawer(`
    <div class="drawer__head"><div style="flex:1"><h2>${esc(a.level)} · ${esc(a.title)}</h2><p>主题 ${esc(a.topic)} · 责任人 ${esc(a.owner)} · ${dateTime(a.windowStart)} 至 ${dateTime(a.windowEnd)}</p></div>
      <button class="icon-btn" data-action="close-drawer" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="drawer__body">
      <div class="row" style="margin-bottom:12px">${badge(LABELS.alertStatus[a.status], a.status)}${badge(`${a.commentIds.length} 条关联评论`, "muted")}</div>
      <p class="hint" style="margin-bottom:14px">${esc(a.summary)}</p>

      <div class="section-title" style="font-size:13px;margin-bottom:8px">触发规则</div>
      <div class="stack" style="margin-bottom:14px">${a.triggerRules.map((r) => `<div class="msg"><div class="mono" style="font-size:11px;color:var(--ink-faint)">${esc(r.ruleId)}</div>${esc(r.description)}</div>`).join("")}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">关联评论</div>
      <div class="stack" style="margin-bottom:14px">${comments.map((c) => `<div class="msg"><div class="msg__meta">${esc(c.author)} · ${esc(LABELS.source[c.source] ?? c.source)} · ${esc(LABELS.sentiment[c.sentiment])}</div>${esc(c.text)}</div>`).join("") || '<p class="hint">无</p>'}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">时间线</div>
      <div class="timeline">${(a.timeline ?? []).map((t) => `<div class="tl-item"><span class="tl-dot"></span><div><div class="tl-title">${esc(t.type)} ${t.from ? `<span class="faint">${esc(t.from)} → ${esc(t.to)}</span>` : ""}<span class="tl-by">${esc(t.by)}</span></div><div class="tl-note">${esc(t.note)}</div><div class="tl-time num">${dateTime(t.at)}</div></div></div>`).join("")}</div>
    </div>`);
}

function openClue(id) {
  const c = state.clues.find((x) => x.id === id);
  if (!c) return;
  const next = { draft: ["routed", "分派给负责人"], routed: ["accepted", "接收方确认"], accepted: ["closed", "关闭（需结果）"], rejected: ["closed", "关闭"] }[c.status];
  const closeInput = c.status === "accepted" ? `<textarea id="clue-outcome" class="input" style="width:100%;height:70px;padding:8px 10px" placeholder="填写关闭结果（必填）"></textarea>` : "";
  const action = next ? `${closeInput}<div class="row" style="margin-top:8px"><button class="btn btn--primary btn--sm" data-action="clue-next" data-id="${esc(c.id)}">${next[1]}</button>
    ${c.status === "routed" ? `<button class="btn btn--sm" data-action="clue-reject" data-id="${esc(c.id)}">拒绝</button>` : ""}</div>` : `<div class="row">${badge("已关闭", "ok")}<span class="hint">${esc(c.outcome || "—")}</span></div>`;
  showDrawer(`
    <div class="drawer__head"><div style="flex:1"><h2>${esc(c.title)}</h2><p>${esc(LABELS.target[c.target] ?? c.target)} · 优先级 ${esc(c.priority)} · 负责人 ${esc(c.owner ?? "—")}</p></div>
      <button class="icon-btn" data-action="close-drawer" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="drawer__body">
      <div class="row" style="margin-bottom:12px">${badge(LABELS.clueStatus[c.status], c.status)}${badge(LABELS.target[c.target] ?? c.target, "info")}</div>
      <p class="hint" style="margin-bottom:14px">${esc(c.description)}</p>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">证据</div>
      <div class="stack" style="margin-bottom:14px">${(c.evidence ?? []).map((e) => `<div class="msg">${esc(e)}</div>`).join("") || '<p class="hint">无</p>'}</div>
      <div class="section-title" style="font-size:13px;margin-bottom:8px">流转</div>${action}
      <div class="section-title" style="font-size:13px;margin:16px 0 8px">时间线</div>
      <div class="timeline">${(c.timeline ?? []).map((t) => `<div class="tl-item"><span class="tl-dot"></span><div><div class="tl-title">${esc(t.type)} ${t.from ? `<span class="faint">${esc(t.from)} → ${esc(t.to)}</span>` : ""}<span class="tl-by">${esc(t.by)}</span></div><div class="tl-note">${esc(t.note)}</div><div class="tl-time num">${dateTime(t.at)}</div></div></div>`).join("")}</div>
    </div>`);
}

function showDrawer(html) {
  $("#drawer").innerHTML = html;
  $("#drawer").classList.add("is-open");
  $("#drawer-mask").classList.add("is-open");
  state.drawer = { open: true };
}
function closeDrawer() {
  $("#drawer").classList.remove("is-open");
  $("#drawer-mask").classList.remove("is-open");
  state.drawer = null;
}

/* ===== 图表 ===== */
function lineChart(rows, labels, series) {
  const W = 640, H = 220, padL = 38, padR = 14, padT = 16, padB = 26;
  const values = rows.flatMap((r) => series.map((s) => Number(r[s.key])));
  const min = Math.min(...values), max = Math.max(...values);
  const lo = Math.max(0, min - (max - min) * 0.25 - 0.02);
  const hi = max + (max - min) * 0.25 + 0.02;
  const x = (i) => padL + (i * (W - padL - padR)) / Math.max(1, rows.length - 1);
  const y = (v) => padT + ((hi - v) / (hi - lo)) * (H - padT - padB);
  const grid = [0, 0.25, 0.5, 0.75, 1].map((t) => {
    const gy = padT + t * (H - padT - padB);
    const val = hi - t * (hi - lo);
    return `<line class="grid-line" x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}"/><text x="${padL - 6}" y="${gy + 3}" text-anchor="end">${(val * 100).toFixed(0)}%</text>`;
  }).join("");
  const paths = series.map((s) => {
    const d = rows.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(Number(r[s.key])).toFixed(1)}`).join(" ");
    const dots = rows.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(Number(r[s.key])).toFixed(1)}" r="2.3" fill="${s.color}"/>`).join("");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }).join("");
  const xLabels = rows.map((r, i) => (i % Math.ceil(rows.length / 6) === 0 || i === rows.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="核心指标趋势">${grid}<line class="axis" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}"/>${paths}${xLabels}</svg>`;
}
function barList(items, tone) {
  const max = Math.max(1, ...items.map((i) => i.value));
  return `<div class="bar-list">${items.map((i) => `<div class="bar-row"><span class="truncate">${esc(i.label)}</span><div class="bar-track"><div class="bar-fill ${i.tone ?? tone}" style="width:${(i.value / max) * 100}%"></div></div><span class="bar-value">${num(i.value)}</span></div>`).join("")}</div>`;
}

/* ===== 通用片段 ===== */
function pageHead(title, desc, extra) {
  return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><span class="spacer"></span>${extra}</div>`;
}
function statItem(label, value, hint) {
  return `<div class="stat"><div class="stat__label">${esc(label)}</div><div class="stat__value">${esc(value)}</div><div class="stat__hint">${esc(hint)}</div></div>`;
}
function kv(label, value) {
  return `<div><div class="hint">${esc(label)}</div><div style="margin-top:2px">${esc(value)}</div></div>`;
}

/* ===== 交互 ===== */
let toastTimer = null;
function toast(title, desc = "") {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<b>${esc(title)}</b>${desc ? `<span>${esc(desc)}</span>` : ""}`;
  $("#toast").appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

function nowIso() { return new Date().toISOString(); }

document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action],[data-route],[data-range],[data-tab]");
  if (!target) return;
  if (target.dataset.route) { go(target.dataset.route); closeDrawer(); return; }
  if (target.dataset.range) { state.range = target.dataset.range; render(); return; }
  const action = target.dataset.action;
  if (!action) return;
  const id = target.dataset.id;

  switch (action) {
    case "close-drawer": closeDrawer(); break;
    case "open-conv": openConv(id); break;
    case "open-knowledge": openKnowledge(id); break;
    case "open-badcase": openBadcase(id); break;
    case "open-alert": openAlert(id); break;
    case "open-clue": openClue(id); break;
    case "sentiment-tab":
      state.sentimentTab = target.dataset.tab;
      render();
      break;
    case "drill": {
      const route = target.dataset.drill === "sentiment" ? "sentiment" : target.dataset.drill;
      if (route === "sentiment") state.sentimentTab = "alerts";
      if (target.dataset.filter) {
        try {
          const f = JSON.parse(target.dataset.filter);
          if (f.status) state.badcaseStatus = f.status;
        } catch { /* 忽略非法筛选 */ }
      }
      go(route); closeDrawer();
      break;
    }
    case "review": {
      const decision = target.dataset.decision;
      const tags = target.dataset.tags ? target.dataset.tags.split(",") : [];
      state.reviews[id] = { decision, finalTags: tags, at: nowIso() };
      toast("复核已提交", decision === "confirm" ? "已确认 AI 判定" : decision === "overturn" ? "已推翻，改判为通过" : `已修正为 ${tags.join("、")}`);
      openConv(id); render();
      break;
    }
    case "badcase-next": {
      const b = state.badcases.find((x) => x.id === id);
      if (!b) break;
      if (b.status === "pending_verify") {
        const proof = ($("#badcase-proof")?.value || "").trim();
        if (!proof) { toast("请填写整改证明", "关闭 badcase 必须提供整改证明"); break; }
        b.status = "closed"; b.proof = proof; b.closedAt = nowIso();
        b.timeline.push({ at: nowIso(), by: "沈言", type: "closed", note: `提交整改证明并关闭：${proof}`, from: "pending_verify", to: "closed" });
      } else {
        const next = { open: "in_progress", in_progress: "pending_verify" }[b.status];
        if (!next) break;
        const from = b.status;
        b.status = next;
        b.timeline.push({ at: nowIso(), by: "负责人", type: next === "in_progress" ? "started" : "submitted", note: next === "in_progress" ? "开始处理 badcase。" : "已提交整改，等待验证。", from, to: next });
      }
      toast("badcase 已更新", `${b.code} → ${LABELS.badcaseStatus[b.status]}`);
      render(); openBadcase(id);
      break;
    }
    case "alert-next": {
      const wrap = state.alerts.find((x) => x.alert.id === id);
      if (!wrap) break;
      const a = wrap.alert;
      const next = { new: "acknowledged", acknowledged: "responding", responding: "escalated", escalated: "resolved" }[a.status];
      if (!next) break;
      const from = a.status; a.status = next;
      a.timeline = a.timeline ?? [];
      a.timeline.push({ at: nowIso(), by: "江岚", type: next, note: "演示操作：SOP 状态推进。", from, to: next });
      if (next === "resolved") a.resolvedAt = nowIso();
      toast("预警状态已更新", `${a.title} → ${LABELS.alertStatus[next]}`);
      render(); openAlert(id);
      break;
    }
    case "clue-next": {
      const c = state.clues.find((x) => x.id === id);
      if (!c) break;
      if (c.status === "accepted") {
        const outcome = ($("#clue-outcome")?.value || "").trim();
        if (!outcome) { toast("请填写关闭结果", "线索关闭必须记录结果"); break; }
        c.outcome = outcome;
      }
      const next = { draft: "routed", routed: "accepted", accepted: "closed" }[c.status];
      if (!next) break;
      const from = c.status; c.status = next;
      c.timeline = c.timeline ?? [];
      c.timeline.push({ at: nowIso(), by: "沈言", type: next, note: "演示操作：线索状态推进。", from, to: next });
      toast("线索已更新", `${c.title} → ${LABELS.clueStatus[next]}`);
      render(); openClue(id);
      break;
    }
    case "clue-reject": {
      const c = state.clues.find((x) => x.id === id);
      if (!c) break;
      const from = c.status; c.status = "rejected";
      c.timeline = c.timeline ?? [];
      c.timeline.push({ at: nowIso(), by: "接收方", type: "rejected", note: "演示操作：接收方拒绝线索。", from, to: "rejected" });
      toast("线索已拒绝"); render(); openClue(id);
      break;
    }
    case "run-eval": {
      const dataset = target.dataset.dataset;
      state.evalRunning = true;
      render();
      setTimeout(() => {
        const existing = state.evalRuns.find((r) => r.dataset === dataset) ?? state.evalRuns[0];
        if (existing) {
          const copy = clone(existing);
          copy.id = `local-${Date.now()}`;
          copy.runAt = nowIso();
          state.evalRuns = [copy, ...state.evalRuns].slice(0, 3);
        }
        state.evalRunning = false;
        toast("评测完成", "演示模式：复用最近一次评测结果，门禁结论不变。");
        render();
      }, 900);
      break;
    }
    case "reset-demo": {
      if (!confirm("重置演示数据？本次演示中的所有状态变更都会丢失。")) break;
      location.reload();
      break;
    }
  }
});

document.addEventListener("input", (event) => {
  const t = event.target;
  if (t.id === "qc-q") { state.qc.q = t.value; render(); const input = $("#qc-q"); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
});

document.addEventListener("change", (event) => {
  const t = event.target;
  if (t.id === "qc-verdict") { state.qc.verdict = t.value; render(); }
  if (t.id === "qc-tag") { state.qc.tag = t.value; render(); }
  if (t.id === "badcase-status") { state.badcaseStatus = t.value; render(); }
  if (t.id === "knowledge-status") { state.kbFilter.status = t.value; render(); }
  if (t.id === "knowledge-category") { state.kbFilter.category = t.value; render(); }
  if (t.id === "comment-sentiment") { state.commentSentiment = t.value; render(); }
});

document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeDrawer(); });
window.addEventListener("hashchange", () => { parseHash(); render(); });
$("#drawer-mask").addEventListener("click", closeDrawer);

parseHash();
render();
</script>
