        entryId: { type: string }
        code: { type: string }
        title: { type: string }
        factKey: { type: string }
        factLabel: { type: string }
        expected: { type: string }
        actual: { type: string }
        ruleId: { type: string }

    KnowledgeSourceRef:
      type: object
      required: [type, id, label]
      properties:
        type: { type: string, enum: [conversation, badcase, manual] }
        id: { type: string }
        label: { type: string }

    KnowledgeEntry:
      type: object
      required: [id, code, title, category, status, version, content, facts, keywords, owner, source, sourceRef, linkedBadcaseIds, revisions, createdAt, updatedAt, publishedAt]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        category: { type: string, enum: [refund, recharge, activity, version, account, other] }
        status: { type: string, enum: [draft, published, offline] }
        version: { type: integer, minimum: 1 }
        content: { type: string }
        facts:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeFact" }
        keywords:
          type: array
          items: { type: string }
        owner: { type: string }
        source: { type: string, enum: [official, qc_badcase, manual] }
        sourceRef:
          allOf:
            - $ref: "#/components/schemas/KnowledgeSourceRef"
          nullable: true
        linkedBadcaseIds:
          type: array
          items: { type: string }
        revisions:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRevision" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }

    KnowledgeListItem:
      type: object
      required: [id, code, title, category, status, version, owner, source, knowledgeHits, linkedHits, linkedBadcases, updatedAt]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        category: { type: string, enum: [refund, recharge, activity, version, account, other] }
        status: { type: string, enum: [draft, published, offline] }
        version: { type: integer }
        owner: { type: string }
        source: { type: string, enum: [official, qc_badcase, manual] }
        knowledgeHits: { type: integer }
        linkedHits: { type: integer }
        linkedBadcases: { type: integer }
        updatedAt: { type: string, format: date-time }

    KnowledgeList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeListItem" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    KnowledgeHit:
      type: object
      required: [conversationId, seq, quote, expected, actual]
      properties:
        conversationId: { type: string }
        agentName: { type: string }
        seq: { type: integer }
        quote: { type: string }
        expected: { type: string }
        actual: { type: string }

    KnowledgeDetail:
      type: object
      required: [entry, hits, badcases]
      properties:
        entry: { $ref: "#/components/schemas/KnowledgeEntry" }
        hits:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeHit" }
        badcases:
          type: array
          items: { $ref: "#/components/schemas/Badcase" }

    KnowledgeStats:
      type: object
      required: [total, published, draft, offline, byCategory, hits, gaps, knowledgeBadcases]
      properties:
        total: { type: integer }
        published: { type: integer }
        draft: { type: integer }
        offline: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              count: { type: integer }
        hits:
          type: object
          required: [knowledgeTags, linked, unlinked, conversations]
          properties:
            knowledgeTags: { type: integer }
            linked: { type: integer }
            unlinked: { type: integer }
            conversations: { type: integer }
            linkRate: { type: number }
        gaps: { type: integer }
        knowledgeBadcases: { type: integer }
        linkedKnowledgeBadcases: { type: integer }

    KnowledgeGap:
      type: object
      required: [id, type, title, count, owner]
      properties:
        id: { type: string }
        type: { type: string, enum: [unlinked_qc_hit, unlinked_badcase] }
        ruleId: { type: string, nullable: true }
        badcaseId: { type: string, nullable: true }
        title: { type: string }
        count: { type: integer }
        category: { type: string, enum: [refund, recharge, activity, version, account, other] }
        owner: { type: string }
        sample:
          type: object
          properties:
            conversationId: { type: string }
            seq: { type: integer }
            quote: { type: string }
            note: { type: string }

    KnowledgeRecheck:
      type: object
      required: [rechecked, changed, before, after, changes]
      properties:
        rechecked: { type: integer }
        changed: { type: integer }
        before: { $ref: "#/components/schemas/KnowledgeRecheckStats" }
        after: { $ref: "#/components/schemas/KnowledgeRecheckStats" }
        changes:
          type: array
          items:
            type: object
            properties:
              conversationId: { type: string }
              beforeTags:
                type: array
                items: { type: string }
              afterTags:
                type: array
                items: { type: string }

    KnowledgeRecheckStats:
      type: object
      required: [knowledgeTags, linkedKnowledgeTags, unlinkedKnowledgeTags, gaps]
      properties:
        knowledgeTags: { type: integer }
        linkedKnowledgeTags: { type: integer }
        unlinkedKnowledgeTags: { type: integer }
        gaps: { type: integer }

    KnowledgeMutationResult:
      type: object
      required: [entry, recheck]
      properties:
        entry: { $ref: "#/components/schemas/KnowledgeEntry" }
        recheck: { $ref: "#/components/schemas/KnowledgeRecheck" }

    KnowledgeActionRequest:
      type: object
      properties:
        by: { type: string }
        note: { type: string }

    KnowledgeCreateRequest:
      type: object
      required: [title, category, content]
      properties:
        title: { type: string }
        category: { type: string, enum: [refund, recharge, activity, version, account, other] }
        content: { type: string }
        facts:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeFact" }
        keywords:
          type: array
          items: { type: string }
        owner: { type: string }
        source: { type: string, enum: [official, qc_badcase, manual] }
        sourceRef:
          allOf:
            - $ref: "#/components/schemas/KnowledgeSourceRef"
          nullable: true
        linkedBadcaseIds:
          type: array
          items: { type: string }

    KnowledgeRevisionRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        facts:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeFact" }
        keywords:
          type: array
          items: { type: string }
        note: { type: string }
        by: { type: string }

    KnowledgeSuggestionRequest:
      type: object
      properties:
        conversationId: { type: string }
        badcaseId: { type: string }
