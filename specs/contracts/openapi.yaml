openapi: 3.0.3
info:
  title: QCC Workbench API
  version: 0.1.0
  description: |
    AI 客服运营质量管控工作台 MVP 接口契约。
    本文件是前后端唯一事实来源；人读说明见 specs/005-api-contract.md。
    演示态无鉴权；所有写操作成功后已持久化。
servers:
  - url: http://127.0.0.1:8787
    description: 本地演示环境
tags:
  - name: meta
  - name: dashboard
  - name: qc
  - name: knowledge
  - name: badcase
  - name: sentiment
  - name: clue
  - name: eval

paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: 字典、角色、标签体系、演示信息
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/admin/reset:
    post:
      tags: [meta]
      operationId: resetDemoData
      summary: 重置演示数据（清空运行态并按 data/ 重新种子）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"
        "500": { $ref: "#/components/responses/Internal" }

  /api/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /api/dashboard/trends:
    get:
      tags: [dashboard]
      operationId: getDashboardTrends
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [range, rows]
                properties:
                  range: { type: string }
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/TrendRow" }
  /api/dashboard/anomalies:
    get:
      tags: [dashboard]
      operationId: getDashboardAnomalies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DashboardAnomaly" }

  /api/qc/stats:
    get:
      tags: [qc]
      operationId: getQcStats
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QcStats" }
  /api/qc/conversations:
    get:
      tags: [qc]
      operationId: listQcConversations
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: verdict
          in: query
          schema: { type: string, enum: [pass, violation] }
        - name: tag
          in: query
          schema: { type: string, enum: [attitude, forbidden, off_topic, wrong_knowledge, timeout, escalation] }
        - name: review
          in: query
          schema: { type: string, enum: [pending, done, none] }
        - name: channel
          in: query
          schema: { type: string, enum: [online, ticket, phone] }
        - name: sort
          in: query
          schema: { type: string, enum: [score_asc, score_desc, time_desc, time_asc], default: time_desc }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationList" }
  /api/qc/conversations/{id}:
    get:
      tags: [qc]
      operationId: getQcConversation
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/qc/conversations/{id}/reviews:
    post:
      tags: [qc]
      operationId: submitQcReview
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/qc/conversations/{id}/badcases:
    post:
      tags: [qc]
      operationId: createBadcaseFromConversation
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BadcaseCreateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Badcase" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/badcases:
    get:
      tags: [badcase]
      operationId: listBadcases
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [open, in_progress, pending_verify, closed] }
        - name: category
          in: query
          schema: { type: string, enum: [knowledge, script, process, system] }
        - name: owner
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BadcaseList" }
  /api/badcases/stats:
    get:
      tags: [badcase]
      operationId: getBadcaseStats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BadcaseStats" }
  /api/badcases/{id}:
    get:
      tags: [badcase]
      operationId: getBadcase
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Badcase" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/badcases/{id}/actions:
    post:
      tags: [badcase]
      operationId: actOnBadcase
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BadcaseActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Badcase" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/sentiment/stats:
    get:
      tags: [sentiment]
      operationId: getSentimentStats
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentimentStats" }
  /api/sentiment/comments:
    get:
      tags: [sentiment]
      operationId: listSentimentComments
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: source
          in: query
          schema: { type: string, enum: [steam, taptap, googleplay, community, ticket] }
        - name: sentiment
          in: query
          schema: { type: string, enum: [positive, neutral, negative] }
        - name: topic
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string, enum: [p0, p1, p2, none] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
  /api/sentiment/alerts:
    get:
      tags: [sentiment]
      operationId: listSentimentAlerts
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: level
          in: query
          schema: { type: string, enum: [P0, P1, P2] }
        - name: status
          in: query
          schema: { type: string, enum: [new, acknowledged, responding, escalated, resolved] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertList" }
  /api/sentiment/alerts/{id}:
    get:
      tags: [sentiment]
      operationId: getSentimentAlert
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/sentiment/alerts/{id}/actions:
    post:
      tags: [sentiment]
      operationId: actOnSentimentAlert
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentimentAlert" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/clues:
    get:
      tags: [clue]
      operationId: listClues
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [draft, routed, accepted, rejected, closed] }
        - name: target
          in: query
          schema: { type: string, enum: [product, brand, market, cs] }
        - name: sourceType
          in: query
          schema: { type: string, enum: [qc, sentiment, dashboard, agent] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClueList" }
    post:
      tags: [clue]
      operationId: createClue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClueCreateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clue" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/clues/{id}:
    get:
      tags: [clue]
      operationId: getClue
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clue" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/clues/{id}/actions:
    post:
      tags: [clue]
      operationId: actOnClue
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClueActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clue" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/eval/datasets:
    get:
      tags: [eval]
      operationId: listEvalDatasets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EvalDataset" }
  /api/eval/runs:
    get:
      tags: [eval]
      operationId: listEvalRuns
      parameters:
        - name: dataset
          in: query
          schema: { type: string, enum: [qc, sentiment] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EvalRunSummary" }
    post:
      tags: [eval]
      operationId: runEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalRunRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/eval/runs/{id}:
    get:
      tags: [eval]
      operationId: getEvalRun
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/knowledge:
    get:
      tags: [knowledge]
      operationId: listKnowledge
      summary: 知识条目列表（筛选/搜索/分页）
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, offline] }
        - name: category
          in: query
          schema: { type: string, enum: [refund, recharge, activity, version, account, other] }
        - name: source
          in: query
          schema: { type: string, enum: [official, qc_badcase, manual] }
        - name: badcaseId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeList" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [knowledge]
      operationId: createKnowledge
      summary: 新建知识草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeCreateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeEntry" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/knowledge/stats:
    get:
      tags: [knowledge]
      operationId: getKnowledgeStats
      summary: 知识库统计与关联率
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeStats" }
  /api/knowledge/gaps:
    get:
      tags: [knowledge]
      operationId: listKnowledgeGaps
      summary: 知识缺口（未覆盖的质检命中 / 未关联的知识类 badcase）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeGap" }
                  total: { type: integer }
  /api/knowledge/suggestions:
    post:
      tags: [knowledge]
      operationId: createKnowledgeSuggestion
      summary: 从质检会话或知识类 badcase 生成草稿（幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeSuggestionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/knowledge/{id}:
    get:
      tags: [knowledge]
      operationId: getKnowledgeEntry
      summary: 知识条目详情（事实/证据/版本/badcase）
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge/{id}/revisions:
    post:
      tags: [knowledge]
      operationId: reviseKnowledge
      summary: 新建修订（已发布条目回到 draft）
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeRevisionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/knowledge/{id}/publish:
    post:
      tags: [knowledge]
      operationId: publishKnowledge
      summary: 发布并自动复测
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeMutationResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/knowledge/{id}/offline:
    post:
      tags: [knowledge]
      operationId: offlineKnowledge
      summary: 下线并自动复测
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeMutationResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/knowledge/{id}/recheck:
    post:
      tags: [knowledge]
      operationId: recheckKnowledge
      summary: 手动复测
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeRecheck" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    Range:
      name: range
      in: query
      schema: { type: string, enum: [7d, 14d, 30d], default: 7d }
    Query:
      name: q
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: 实体不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状态冲突（非法状态转移 / 重复操作）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: 请求参数不符合契约
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: 服务端错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [BAD_REQUEST, NOT_FOUND, CONFLICT, VALIDATION_ERROR, INTERNAL] }
            message: { type: string }
            details: { type: object, nullable: true, additionalProperties: true }

    Health:
      type: object
      required: [status, version, uptimeSec]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        uptimeSec: { type: number }

    Meta:
      type: object
      required: [product, version, generatedAt, modelVersion, roles, owners, tagTaxonomy, topics, sources, clueTargets, statusLabels, demo]
      properties:
        product: { type: string }
        version: { type: string }
        generatedAt: { type: string, format: date-time }
        modelVersion: { type: string }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
        owners:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              name: { type: string }
        tagTaxonomy:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              description: { type: string }
              severity: { type: string, enum: [low, medium, high] }
              weight: { type: integer }
        topics:
          type: array
          items: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
        clueTargets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
        statusLabels:
          type: object
          description: 状态中文文案，按实体分组的嵌套对象（v0.1.1 冻结，共 14 个状态键）
          required: [badcase, alert, clue]
          additionalProperties: false
          properties:
            badcase:
              type: object
              required: [open, in_progress, pending_verify, closed]
              additionalProperties: { type: string }
            alert:
              type: object
              required: [new, acknowledged, responding, escalated, resolved]
              additionalProperties: { type: string }
            clue:
              type: object
              required: [draft, routed, accepted, rejected, closed]
              additionalProperties: { type: string }
        demo:
          type: object
          properties:
            datasetVersion: { type: string }
            resetAvailable: { type: boolean }
            itemCounts:
              type: object
              properties:
                qc: { type: integer }
                sentiment: { type: integer }

    ResetResult:
      type: object
      required: [ok, seeded, resetAt]
      properties:
        ok: { type: boolean }
        resetAt: { type: string, format: date-time }
        seeded:
          type: object
          properties:
            conversations: { type: integer }
            qcResults: { type: integer }
            comments: { type: integer }
            badcases: { type: integer }
            alerts: { type: integer }
            clues: { type: integer }
            metricSnapshots: { type: integer }

    Message:
      type: object
      required: [seq, role, text, atSec]
      properties:
        seq: { type: integer }
        role: { type: string, enum: [customer, agent, system] }
